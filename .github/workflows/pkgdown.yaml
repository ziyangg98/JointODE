# Deploy pre-built pkgdown site from docs/ directory.
# Run `pkgdown::build_site()` locally before pushing.
on:
  push:
    branches: [main, master]
    paths: [docs/**]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
